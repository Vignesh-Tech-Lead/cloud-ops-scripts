# ==============================================================================
# Use Case: Kubernetes Service - Apache
# Description: Exposes the apache deployment internally.
# 
# Explanation: This file is part of the k8s suite. It provides a standardized template for apache-service.yaml to maintain infrastructure and application reliability.
# 
# How to Use:
# Run 'kubectl apply -f apache-service.yaml' to deploy this resource to your Kubernetes cluster.
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: apache-service
spec:
  selector:
    app: apache
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
