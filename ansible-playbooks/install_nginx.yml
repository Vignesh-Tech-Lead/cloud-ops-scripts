---
# ==============================================================================
# Use Case: Configuration Management - Install Nginx
# Description: Installs and configures nginx on target nodes.
# 
# Explanation: This file is part of the Ansable suite. It provides a standardized template for install_nginx.yml to maintain infrastructure and application reliability.
# 
# How to Use:
# Run 'ansible-playbook -i inventory.ini install_nginx.yml' to apply this configuration to your target nodes.
# ==============================================================================
- name: Install nginx
  hosts: all
  become: yes
  tasks:
    - name: Ensure nginx is installed
      package:
        name: "nginx"
        state: present
    - name: Start nginx service
      service:
        name: "nginx"
        state: started
        enabled: yes
