# ==============================================================================
# Use Case: Alerting - Swap High Usage
# Description: Prometheus alert rule for swap exhaustion.
# 
# Explanation: This file is part of the Monitoring Configs suite. It provides a standardized template for alert_swap.yml to maintain infrastructure and application reliability.
# 
# How to Use:
# Include this file in your Prometheus configuration directory and restart the Prometheus service to apply the new alert rules.
# ==============================================================================
groups:
- name: swap_alerts
  rules:
  - alert: HighSwapUsage
    expr: node_swap_usage > 90
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "High swap usage detected on {{ $labels.instance }}"
