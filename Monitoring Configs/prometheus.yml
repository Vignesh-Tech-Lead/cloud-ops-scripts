# ==============================================================================
# Use Case: Metrics Collection and Monitoring
# Description: Configuration file for Prometheus to scrape metrics from node
#              exporters and application endpoints.
# 
# Explanation: This file is part of the Monitoring Configs suite. It provides a standardized template for prometheus.yml to maintain infrastructure and application reliability.
# 
# How to Use:
# Include this file in your Prometheus configuration directory and restart the Prometheus service to apply the new alert rules.
# ==============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'web_app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['web-app:8080']
