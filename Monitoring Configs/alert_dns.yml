# ==============================================================================
# Use Case: Alerting - Dns High Usage
# Description: Prometheus alert rule for dns exhaustion.
# 
# Explanation: This file is part of the Monitoring Configs suite. It provides a standardized template for alert_dns.yml to maintain infrastructure and application reliability.
# 
# How to Use:
# Include this file in your Prometheus configuration directory and restart the Prometheus service to apply the new alert rules.
# ==============================================================================
groups:
- name: dns_alerts
  rules:
  - alert: HighDnsUsage
    expr: node_dns_usage > 90
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "High dns usage detected on {{ $labels.instance }}"
