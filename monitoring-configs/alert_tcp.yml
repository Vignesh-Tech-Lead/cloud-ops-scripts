# ==============================================================================
# Use Case: Alerting - Tcp High Usage
# Description: Prometheus alert rule for tcp exhaustion.
# 
# Explanation: This file is part of the Monitoring Configs suite. It provides a standardized template for alert_tcp.yml to maintain infrastructure and application reliability.
# 
# How to Use:
# Include this file in your Prometheus configuration directory and restart the Prometheus service to apply the new alert rules.
# ==============================================================================
groups:
- name: tcp_alerts
  rules:
  - alert: HighTcpUsage
    expr: node_tcp_usage > 90
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "High tcp usage detected on {{ $labels.instance }}"
