# ==============================================================================
# Use Case: Alerting - Inodes High Usage
# Description: Prometheus alert rule for inodes exhaustion.
# 
# Explanation: This file is part of the Monitoring Configs suite. It provides a standardized template for alert_inodes.yml to maintain infrastructure and application reliability.
# 
# How to Use:
# Include this file in your Prometheus configuration directory and restart the Prometheus service to apply the new alert rules.
# ==============================================================================
groups:
- name: inodes_alerts
  rules:
  - alert: HighInodesUsage
    expr: node_inodes_usage > 90
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "High inodes usage detected on {{ $labels.instance }}"
