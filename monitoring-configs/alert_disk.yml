# ==============================================================================
# Use Case: Alerting - Disk High Usage
# Description: Prometheus alert rule for disk exhaustion.
# 
# Explanation: This file is part of the Monitoring Configs suite. It provides a standardized template for alert_disk.yml to maintain infrastructure and application reliability.
# 
# How to Use:
# Include this file in your Prometheus configuration directory and restart the Prometheus service to apply the new alert rules.
# ==============================================================================
groups:
- name: disk_alerts
  rules:
  - alert: HighDiskUsage
    expr: node_disk_usage > 90
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "High disk usage detected on {{ $labels.instance }}"
