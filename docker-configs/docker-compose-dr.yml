# ==============================================================================
# Use Case: Docker Compose - DR Environment
# Description: Multi-container setup for dr testing.
# 
# Explanation: This file is part of the Docker suite. It provides a standardized template for docker-compose-dr.yml to maintain infrastructure and application reliability.
# 
# How to Use:
# Run 'docker-compose -f docker-compose-dr.yml up -d' to start the environment in the background.
# ==============================================================================
version: '3.8'
services:
  app:
    image: myapp:dr
    ports:
      - "8080:8080"
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: dr_db
