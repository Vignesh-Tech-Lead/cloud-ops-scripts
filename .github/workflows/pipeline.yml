# ==============================================================================
# Use Case: CI/CD Pipeline - GitHub Actions
# Description: Automated pipeline to lint, build, and deploy the application.
# 
# Explanation: This file defines the continuous integration and delivery pipeline for GitHub Actions. It ensures all code is tested before reaching production.
# 
# How to Use:
# Commit this file to the .github/workflows directory of your repository. GitHub will automatically trigger this pipeline on push.
# ==============================================================================
name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Install dependencies
      run: npm ci
    - name: Run tests
      run: npm test

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build Docker Image
      run: docker build -t myapp:latest .
